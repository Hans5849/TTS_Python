name: Review source snapshot
on:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source without Git credentials
        run: git archive --format=tar.gz HEAD > /tmp/review-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: /tmp/review-source.tar.gz
          retention-days: 3
