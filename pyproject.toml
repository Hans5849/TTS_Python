[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-python"
version = "4.0.0a2"
description = "Privacy-aware, reusable document-to-speech pipeline"
requires-python = ">=3.11"
dependencies = ["speech-common==0.1.0", "PyYAML>=6,<7"]

[project.optional-dependencies]
openai = ["openai>=1,<3"]
test = ["pytest>=8"]

[project.scripts]
tts = "tts_python.cli:main"
audioconversion = "tts_python.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
